[project]
name = "pgym"
version = "0.1.0"
description = "Playground for ProteinGym benchmarks without pretrained models (GP / Bayesian optimization)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "biopython>=1.84",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
